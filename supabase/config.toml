project_id = "homestay-saas"

[api]
enabled = true
port = 54331
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54333

# Local mailbox for confirmation / reset emails during development.
[local_smtp]
enabled = true
port = 54334

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "homestay://auth/callback",
  "exp://127.0.0.1:8081/--/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
# Local dev only. Hosted projects should keep this at 6+ and use a real SMTP provider.
max_frequency = "10s"

[auth.sms]
enable_signup = true
enable_confirmations = true

# GoTrue refuses phone logins outright unless a provider is enabled, so a
# provider has to be on for test_otp below to be reachable. These are dummy
# local-only placeholders, not credentials: the numbers listed in
# [auth.sms.test_otp] short-circuit before any request leaves the container.
# Hosted projects configure a real provider in the dashboard instead.
[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Sign in as this number with code 123456. No SMS is sent.
[auth.sms.test_otp]
"+85512000000" = "123456"

# Providers are toggled here for local dev and in the dashboard for hosted
# projects. Secrets come from the environment, never from this file.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
redirect_uri = ""

[analytics]
enabled = false

# Phase 6A. Platform-level JWT check in front of the function's own
# auth.getUser() call — belt and suspenders, not a substitute for it.
[functions.ocr-payment-proof]
verify_jwt = true
